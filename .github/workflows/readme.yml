name: 'Update README'
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
jobs:
  update-readme:
    name: 'Update README'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'niemiecki-agent-tusk/waka-readme-stats@master'
        with:
          WAKATIME_API_KEY: '${{ secrets.WAKATIME_TOKEN }}'
          GH_TOKEN: '${{ secrets.GH_TOKEN }}'
          COMMIT_BY_ME: "False"
          COMMIT_MESSAGE: "[auto] update readme"
          SHOW_UPDATED_DATE: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SECTION_NAME: "github-stats"
          SHOW_TIMEZONE: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_LOC_CHART: "False"
